<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Student Super Toolkit Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#f5f7fb;
 --card:#fff;
 --text:#111827;
 --muted:#64748b;
 --primary:#2563eb;
 --border:#e2e8f0;
 --danger:#ef4444;
 --shadow:0 8px 30px rgba(15,23,42,.08);
}
body.dark{
 --bg:#0b1120;
 --card:#111827;
 --text:#f8fafc;
 --muted:#94a3b8;
 --border:#243044;
 --shadow:0 8px 30px rgba(0,0,0,.25);
}
body{
 font-family:Inter,Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
 transition:.2s;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{
 width:270px;
 background:var(--card);
 border-right:1px solid var(--border);
 position:fixed;
 top:0;bottom:0;left:0;
 overflow-y:auto;
 z-index:50;
 transition:.25s;
}
.logo{
 padding:22px;
 font-size:21px;
 font-weight:800;
 border-bottom:1px solid var(--border);
}
.logo span{color:var(--primary)}
.nav{padding:15px}
.nav button{
 width:100%;
 text-align:left;
 border:0;
 background:transparent;
 color:var(--text);
 padding:12px 14px;
 border-radius:10px;
 margin-bottom:4px;
}
.nav button:hover,.nav button.active{
 background:rgba(37,99,235,.1);
 color:var(--primary);
}
.main{
 margin-left:270px;
 width:calc(100% - 270px);
}
.topbar{
 height:70px;
 display:flex;
 align-items:center;
 gap:12px;
 padding:12px 20px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 position:sticky;
 top:0;
 z-index:40;
}
.menuBtn{
 width:44px;height:44px;
 border:1px solid var(--border);
 background:var(--card);
 color:var(--text);
 border-radius:10px;
 font-size:22px;
}
.search{
 flex:1;
 max-width:650px;
 position:relative;
}
.search input{
 width:100%;
 padding:13px 17px 13px 44px;
 border:1px solid var(--border);
 border-radius:12px;
 outline:none;
 background:var(--bg);
 color:var(--text);
}
.searchIcon{
 position:absolute;
 left:15px;top:12px;
}
.topActions{margin-left:auto;display:flex;gap:8px}
.iconBtn{
 width:42px;height:42px;
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--card);
 color:var(--text);
}
.content{padding:25px;max-width:1500px;margin:auto}
.hero{
 padding:28px;
 border-radius:20px;
 background:linear-gradient(135deg,#2563eb,#7c3aed);
 color:white;
 margin-bottom:25px;
 box-shadow:var(--shadow);
}
.hero h1{font-size:32px;margin-bottom:8px}
.hero p{opacity:.9}
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
 margin-top:20px;
}
.stat{
 background:rgba(255,255,255,.15);
 padding:15px;
 border-radius:12px;
}
.sectionTitle{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:25px 0 14px;
}
.sectionTitle h2{font-size:20px}
.tools{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:15px;
}
.tool{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:16px;
 padding:18px;
 box-shadow:var(--shadow);
 cursor:pointer;
 transition:.18s;
}
.tool:hover{transform:translateY(-3px);border-color:var(--primary)}
.toolIcon{
 width:45px;height:45px;
 display:grid;place-items:center;
 background:rgba(37,99,235,.1);
 border-radius:12px;
 font-size:22px;
 margin-bottom:12px;
}
.tool h3{font-size:16px;margin-bottom:5px}
.tool p{font-size:13px;color:var(--muted)}
.badge{
 display:inline-block;
 margin-top:10px;
 font-size:11px;
 color:var(--primary);
 background:rgba(37,99,235,.1);
 padding:4px 7px;
 border-radius:6px;
}
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.6);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:100;
 padding:15px;
}
.modal.show{display:flex}
.modalBox{
 width:min(750px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 border-radius:18px;
 padding:22px;
}
.modalHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:18px;
}
.close{
 border:0;
 background:transparent;
 color:var(--text);
 font-size:26px;
}
.field{margin-bottom:15px}
.field label{
 display:block;
 margin-bottom:7px;
 font-weight:600;
 font-size:14px;
}
.field input,.field textarea,.field select{
 width:100%;
 padding:12px;
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--bg);
 color:var(--text);
 outline:none;
}
textarea{min-height:140px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{
 border:0;
 padding:11px 16px;
 border-radius:9px;
 background:var(--primary);
 color:#fff;
 font-weight:600;
}
.btn.secondary{
 background:var(--bg);
 color:var(--text);
 border:1px solid var(--border);
}
.result{
 padding:15px;
 margin-top:15px;
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--bg);
 white-space:pre-wrap;
 word-break:break-word;
}
.drawer{
 position:fixed;
 right:-340px;
 top:0;
 bottom:0;
 width:330px;
 background:var(--card);
 z-index:80;
 box-shadow:var(--shadow);
 padding:20px;
 transition:.25s;
}
.drawer.open{right:0}
.drawer h2{margin-bottom:20px}
.drawer button{
 display:block;
 width:100%;
 padding:13px;
 margin-bottom:8px;
 border:1px solid var(--border);
 background:var(--bg);
 color:var(--text);
 border-radius:10px;
 text-align:left;
}
.toast{
 position:fixed;
 bottom:25px;
 left:50%;
 transform:translateX(-50%) translateY(100px);
 background:#111827;
 color:white;
 padding:12px 18px;
 border-radius:10px;
 opacity:0;
 transition:.25s;
 z-index:200;
}
.toast.show{
 opacity:1;
 transform:translateX(-50%) translateY(0);
}
.empty{
 text-align:center;
 padding:50px;
 color:var(--muted);
}
@media(max-width:850px){
 .sidebar{left:-280px}
 .sidebar.open{left:0}
 .main{margin-left:0;width:100%}
 .stats{grid-template-columns:repeat(2,1fr)}
 .content{padding:15px}
}
@media(max-width:500px){
 .hero h1{font-size:24px}
 .stats{grid-template-columns:1fr 1fr}
 .row{grid-template-columns:1fr}
 .tools{grid-template-columns:1fr 1fr}
 .tool{padding:14px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">
 <div class="logo">🚀 Student <span>Super Toolkit</span></div>
 <div class="nav">
  <button class="active" onclick="showCategory('All',this)">🏠 All Tools</button>
  <button onclick="showCategory('Study',this)">📚 Study</button>
  <button onclick="showCategory('Math',this)">🧮 Mathematics</button>
  <button onclick="showCategory('Text',this)">✍️ Text</button>
  <button onclick="showCategory('Developer',this)">💻 Developer</button>
  <button onclick="showCategory('Converter',this)">🔄 Converters</button>
  <button onclick="showCategory('Time',this)">⏱️ Time</button>
  <button onclick="showCategory('Security',this)">🔐 Security</button>
  <button onclick="showCategory('Web',this)">🌐 Web</button>
  <button onclick="showCategory('Utility',this)">🛠️ Utilities</button>

</aside>

<main class="main">

<header class="topbar">

 <div class="search">
  <span class="searchIcon">🔎</span>

 </div>

 <div class="topActions">
  <button class="iconBtn" onclick="toggleTheme()" title="Dark mode">🌙</button>
  <button class="iconBtn" onclick="toggleDrawer()" title="More">⋮</button>
 </div>
</header>

<section class="content">

<div class="hero">
 <h1>Student Super Toolkit Pro 🚀</h1>
 <p>Powerful browser-based tools for study, coding, mathematics and everyday work.</p>

 <div class="stats">
  <div class="stat"><b id="toolCount">0</b><br>Tools</div>
  <div class="stat"><b id="favCount">0</b><br>Favorites</div>
  <div class="stat"><b>100%</b><br>Browser Based</div>
  <div class="stat"><b>Free</b><br>No API Key</div>
 </div>
</div>

<div class="sectionTitle">
 <h2 id="sectionName">All Tools</h2>
</div>

<div class="tools" id="tools"></div>

</section>
</main>
</div>

<!-- DRAWER -->

<div class="drawer" id="drawer">
 <h2>⚙️ Quick Settings</h2>

 <button onclick="toggleTheme()">🌙 Toggle Dark Mode</button>
 <button onclick="showFavorites()">⭐ Show Favorites</button>
 <button onclick="showCategory('All')">🏠 All Tools</button>
 <button onclick="clearFavorites()">🗑️ Clear Favorites</button>
 <button onclick="clearHistory()">🧹 Clear Tool History</button>
 <button onclick="exportSettings()">📦 Export Settings</button>
 <button onclick="closeDrawer()">✕ Close Menu</button>
</div>

<!-- MODAL -->

<div class="modal" id="modal">
 <div class="modalBox">
  <div class="modalHead">
   <h2 id="modalTitle">Tool</h2>
   <button class="close" onclick="closeModal()">×</button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

<div class="toast" id="toast"></div>

function safeMath(expr){
 expr=expr.replace(/\^/g,"**")
  .replace(/\bsqrt\b/g,"Math.sqrt")
  .replace(/\bsin\b/g,"Math.sin")
  .replace(/\bcos\b/g,"Math.cos")
  .replace(/\btan\b/g,"Math.tan")
  .replace(/\blog\b/g,"Math.log10")
  .replace(/\babs\b/g,"Math.abs")
  .replace(/\bpi\b/gi,"Math.PI");

 if(!/^[0-9+\-*/().,\sA-Za-z*]+$/.test(expr))
  throw new Error("Invalid expression");

 return Function('"use strict";return ('+expr+')')();
}

function calculate(){
 try{
  document.getElementById("calcResult").textContent=
   "Result: "+safeMath(document.getElementById("calcInput").value);
 }catch(e){
  document.getElementById("calcResult").textContent="❌ Invalid calculation";
 }
}

function quadratic(){
 const a=Number(document.getElementById("qa").value);
 const b=Number(document.getElementById("qb").value);
 const c=Number(document.getElementById("qc").value);

 if(a===0){
  document.getElementById("quadResult").textContent="a cannot be 0.";
  return;
 }

 const d=b*b-4*a*c;

 if(d>0){
  const x1=(-b+Math.sqrt(d))/(2*a);
  const x2=(-b-Math.sqrt(d))/(2*a);
  document.getElementById("quadResult").textContent=
   `x₁ = ${x1}\nx₂ = ${x2}`;
 }else if(d===0){
  document.getElementById("quadResult").textContent=
   `x = ${-b/(2*a)}`;
 }else{
  const real=-b/(2*a);
  const imag=Math.sqrt(-d)/(2*a);
  document.getElementById("quadResult").textContent=
   `x₁ = ${real} + ${imag}i\nx₂ = ${real} - ${imag}i`;
 }
}

function passwords(){
 const chars=
 "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}";
 const len=Math.min(100,Math.max(4,Number(document.getElementById("passLength").value)));
 const count=Math.min(20,Math.max(1,Number(document.getElementById("passCount").value)));

 let out=[];

 for(let n=0;n<count;n++){
  let s="";
  const arr=new Uint32Array(len);
  crypto.getRandomValues(arr);

  for(let i=0;i<len;i++)
   s+=chars[arr[i]%chars.length];

  out.push(s);
 }

 document.getElementById("passResult").textContent=out.join("\n");
}

async function hashText(){
 const text=document.getElementById("hashInput").value;
 const data=new TextEncoder().encode(text);
 const hash=await crypto.subtle.digest("SHA-256",data);

 const hex=[...new Uint8Array(hash)]
  .map(b=>b.toString(16).padStart(2,"0"))
  .join("");

 document.getElementById("hashResult").textContent=hex;
}

let swStart=0;

let swInterval=null;

function updateSW(){
 const e=swElapsed+(swStart?Date.now()-swStart:0);

 const h=Math.floor(e/3600000);
 const m=Math.floor(e/60000)%60;
 const s=Math.floor(e/1000)%60;
 const ms=Math.floor(e%1000/10);

 document.getElementById("swDisplay").textContent=
  `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms).padStart(2,"0")}`;
}

function startSW(){
 if(swStart)return;
 swStart=Date.now();
 swInterval=setInterval(updateSW,30);
}

function stopSW(){
 if(!swStart)return;
 swElapsed+=Date.now()-swStart;
 swStart=0;
 clearInterval(swInterval);
 updateSW();
}

function resetSW(){
 swStart=0;
 swElapsed=0;
 clearInterval(swInterval);
 if(document.getElementById("swDisplay"))
  document.getElementById("swDisplay").textContent="00:00:00.00";
}

let timerInterval=null;

function startTimer(){
 clearInterval(timerInterval);

 let sec=Math.max(0,Number(document.getElementById("timerSeconds").value));

 const out=document.getElementById("timerResult");

 function tick(){
  out.textContent=`${sec} seconds remaining`;

  if(sec<=0){
   clearInterval(timerInterval);
   out.textContent="⏰ Time's up!";
   return;
  }

  sec--;
 }

 tick();
 timerInterval=setInterval(tick,1000);
}

function stopTimer(){
 clearInterval(timerInterval);
}

function genericTool(name,cat){

 const modalBody=document.getElementById("modalBody");

 modalBody.innerHTML=`
 <div class="field">
  <label>Input</label>
  <input id="genericInput" placeholder="Enter a value">
 </div>

 `;

function runGeneric(name){

 const input=document.getElementById("genericInput").value;
 const out=document.getElementById("genericResult");

 if(name==="Even/Odd Checker"){
  const n=Number(input);
  out.textContent=Number.isFinite(n)?(n%2===0?"Even":"Odd"):"Invalid number";
  return;
 }

 if(name==="Prime Checker"){
  const n=Number(input);
  if(n<2||!Number.isInteger(n)){
   out.textContent="Not prime";
   return;
  }

  let prime=true;
  for(let i=2;i<=Math.sqrt(n);i++){
   if(n%i===0){prime=false;break}
  }

  out.textContent=prime?"Prime":"Not prime";
  return;
 }

 if(name==="Factorial Calculator"){
  const n=Number(input);

  if(n<0||n>170||!Number.isInteger(n)){
   out.textContent="Enter an integer from 0 to 170.";
   return;
  }

  let x=1;
  for(let i=2;i<=n;i++)x*=i;
  out.textContent=x;
  return;
 }

 if(name==="Square Calculator"){
  const n=Number(input);
  out.textContent=n*n;
  return;
 }

 if(name==="Cube Calculator"){
  const n=Number(input);
  out.textContent=n*n*n;
  return;
 }

 if(name==="Power Calculator"){
  const parts=input.split(",").map(Number);
  out.textContent=
   parts.length===2?Math.pow(parts[0],parts[1]):"Use base,exponent";
  return;
 }

 if(name==="LCM Calculator"){
  const a=input.split(",").map(Number);

  function gcd(x,y){
   while(y){let t=x%y;x=y;y=t}
   return Math.abs(x);
  }

  if(a.length<2){
   out.textContent="Enter two or more numbers.";
   return;
  }

  let result=Math.abs(a[0]);

  for(let i=1;i<a.length;i++)
   result=Math.abs(result*a[i])/gcd(result,a[i]);

  out.textContent=result;
  return;
 }

 if(name==="GCD Calculator"){
  const a=input.split(",").map(Number);

  function gcd(x,y){
   while(y){let t=x%y;x=y;y=t}
   return Math.abs(x);
  }

  let result=Math.abs(a[0]);

  for(let i=1;i<a.length;i++)
   result=gcd(result,a[i]);

  out.textContent=result;
  return;
 }

 if(name==="Binary Converter"){
  const n=Number(input);
  out.textContent=
   Number.isInteger(n)?n.toString(2):"Enter an integer.";
  return;
 }

 if(name==="Hex Converter"){
  const n=Number(input);
  out.textContent=
   Number.isInteger(n)?n.toString(16).toUpperCase():"Enter an integer.";
  return;
 }

 if(name==="Octal Converter"){
  const n=Number(input);
  out.textContent=
   Number.isInteger(n)?n.toString(8):"Enter an integer.";
  return;
 }

 if(name==="ASCII Converter"){
  const n=Number(input);
  out.textContent=
   Number.isInteger(n)&&n>=0&&n<=127
   ?String.fromCharCode(n)
   :"Enter ASCII code 0-127.";
  return;
 }

 if(name==="Character Counter"){
  out.textContent=`Characters: ${input.length}`;
  return;
 }

 if(name==="Line Counter"){
  out.textContent=`Lines: ${input?input.split(/\n/).length:0}`;
  return;
 }

 if(name==="Sentence Counter"){
  const n=input.match(/[.!?]+(?=\s|$)/g)||[];
  out.textContent=`Sentences: ${n.length}`;
  return;
 }

 if(name==="Vowel Counter"){
  out.textContent=
   `Vowels: ${(input.match(/[aeiou]/gi)||[]).length}`;
  return;
 }

 if(name==="Consonant Counter"){
  out.textContent=
   `Consonants: ${(input.match(/[bcdfghjklmnpqrstvwxyz]/gi)||[]).length}`;
  return;
 }

 if(name==="Number to Words"){
  out.textContent=numberWords(Number(input));
  return;
 }

 if(name==="Slug Generator"){
  out.textContent=input.toLowerCase()
   .trim()
   .replace(/[^a-z0-9]+/g,"-")
   .replace(/^-|-$/g,"");
  return;
 }

 if(name==="Lorem Ipsum"){
  out.textContent=
   "Lorem ipsum dolor sit amet, consectetur adipiscing elit. "+
   "Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.";
  return;
 }

 if(name==="Coin Flip"){
  out.textContent=Math.random()<.5?"Heads":"Tails";
  return;
 }

 if(name==="Random Choice"){
  const a=input.split(",").map(x=>x.trim()).filter(Boolean);
  out.textContent=a.length?a[Math.floor(Math.random()*a.length)]:"No choices.";
  return;
 }

 if(name==="PIN Generator"){
  let s="";
  for(let i=0;i<6;i++)s+=Math.floor(Math.random()*10);
  out.textContent=s;
  return;
 }

 if(name==="Random Password"){
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";
  let s="";
  for(let i=0;i<16;i++)
   s+=chars[Math.floor(Math.random()*chars.length)];
  out.textContent=s;
  return;
 }

 if(name==="Text to Binary"){
  out.textContent=[...input]
   .map(c=>c.charCodeAt(0).toString(2).padStart(8,"0"))
   .join(" ");
  return;
 }

 if(name==="Binary to Text"){
  try{
   out.textContent=input.trim().split(/\s+/)
    .map(x=>String.fromCharCode(parseInt(x,2))).join("");
  }catch{
   out.textContent="Invalid binary.";
  }
  return;
 }

 if(name==="Text to Hex"){
  out.textContent=[...input]
   .map(c=>c.charCodeAt(0).toString(16).padStart(2,"0"))
   .join(" ");
  return;
 }

 if(name==="Hex to Text"){
  try{
   out.textContent=input.trim().split(/\s+/)
    .map(x=>String.fromCharCode(parseInt(x,16))).join("");
  }catch{
   out.textContent="Invalid hexadecimal.";
  }
  return;
 }

 if(name==="HTML Preview"){
  const frame=document.createElement("iframe");
  frame.style.width="100%";
  frame.style.height="300px";
  frame.style.border="1px solid var(--border)";
  frame.srcdoc=input;

  out.innerHTML="";
  out.appendChild(frame);
  return;
 }

 if(name==="JSON Validator"){
  try{
   JSON.parse(input);
   out.textContent="✅ Valid JSON";
  }catch(e){
   out.textContent="❌ Invalid JSON";
  }
  return;
 }

 out.textContent=
  "This tool is ready for the advanced implementation layer.";
}

/* =========================================================
   NUMBER TO WORDS
========================================================= */

function numberWords(n){

 if(!Number.isInteger(n)||n<0||n>999999999){
  return "Enter an integer from 0 to 999,999,999.";
 }

 if(n===0)return "Zero";

 const ones=[
 "","One","Two","Three","Four","Five","Six","Seven","Eight","Nine",
 "Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen",
 "Seventeen","Eighteen","Nineteen"
 ];

 const tens=[
 "","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"
 ];

 function under1000(x){

  let s="";

  if(x>=100){
   s+=ones[Math.floor(x/100)]+" Hundred";
   x%=100;
   if(x)s+=" ";
  }

  if(x>=20){
   s+=tens[Math.floor(x/10)];
   x%=10;
   if(x)s+=" "+ones[x];
  }else if(x>0){
   s+=ones[x];
  }

  return s;
 }

 let result="";

 if(n>=1000000){
  result+=under1000(Math.floor(n/1000000))+" Million";
  n%=1000000;
  if(n)result+=" ";
 }

 if(n>=1000){
  result+=under1000(Math.floor(n/1000))+" Thousand";
  n%=1000;
  if(n)result+=" ";
 }

 if(n)result+=under1000(n);

 return result;
}

/* =========================================================
   EXPORT SETTINGS
========================================================= */

function exportSettings(){

 const data={
  theme:localStorage.getItem("theme")||"light",
  favorites:getFavs(),
  history:JSON.parse(localStorage.getItem("history")||"[]")
 };

 const blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="student-toolkit-settings.json";
 a.click();

 URL.revokeObjectURL(a.href);
}

/* =========================================================
   TOAST
========================================================= */

function toast(message){
 const t=document.getElementById("toast");
 t.textContent=message;
 t.classList.add("show");

 setTimeout(()=>t.classList.remove("show"),2000);
}
